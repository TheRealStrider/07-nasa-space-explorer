<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/NASA-Logo-Large.jpg" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <section class="fact-card" aria-labelledby="fact-title">
      <p class="eyebrow">COSMIC CURIOSITY</p>
      <h2 id="fact-title">Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <form class="filters" id="dateForm">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button type="submit">Get Space Images</button>
    </form>

    <main id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </main>
  </div>

  <div class="modal" id="imageModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <article class="modal-content">
      <button class="modal-close" type="button" aria-label="Close photo details" data-close-modal>&times;</button>
      <img id="modalImage" src="" alt="" />
      <div class="modal-copy">
        <p class="eyebrow">NASA APOD</p>
        <h2 id="modalTitle"></h2>
        <p class="modal-date" id="modalDate"></p>
        <p id="modalExplanation"></p>
      </div>
    </article>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
